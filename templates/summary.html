<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
  <title>Summary</title>
</head>

<body>
  <nav class="nav">
    <div class="container-fluid nav-items">
      <div class="logo">
        Grocery Store
      </div>
      <div class="search-box">
        <form action="/admin_search" method="POST">
          <input class="search" type="search" placeholder="Search by product or category" name="search" value="{{search}}">
          <button class="search-btn" type="submit"><i class=" bi fs-5 bi-search"></i></button>
        </form>
      </div>
      <div class="links">
        <div class="icon"><a href="/admin">Home</a></div>
        <div class="icon"><a href="/logout">Logout</a></div>
      </div>
    </div>
  </nav>
  <h6 class="display-6 text-center my-2">Summary about the current month</h6> 
  <hr>
  <div class="container_fluid summary">
  <div class="barchart">
    <img src="static/images/barchart.png" alt="Sales Chart" width="100%">
  </div>
  <div class="info">
    <div class="box">
      <div class="sub_box">
        <div class="num">{{users|length}}</div>  
        <div>Users</div>
      </div>
      <div class="sub_box">
        <div class="num">{{products|length}}</div>  
        <div>Products</div>
      </div>
    </div>
    <div class="box">
        <div class="sub_box">
            <div class="num">{{categories|length}}</div>  
            <div>Categories</div>
          </div>
          <div class="sub_box">
            <div class="num">{{prod_name}}</div>  
            <div>Most demanded product</div>
          </div>
    </div> 
    <div class="box">
        <div class="sub_box">
            <div class="num">₹ {{revenue}}</div>  
            <div>Total Revenue</div>
          </div>
          <div class="sub_box">
            <div class="num">{{sold_prod}}</div>  
            <div>Total sold products</div>
          </div>
    </div> 
  </div>
</div>
<br>

  <script src="/static/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
    crossorigin="anonymous"></script>
</body>
</body>

</html>
