<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Category</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='form.css') }}">
</head>

<body>
  <nav class="nav">
    <div class="container-fluid nav-items">
      <div class="logo">
        Grocery Store
      </div>
      <div class="search-box">
        <form action="/admin_search" method="POST">
          <input class="search" type="search" placeholder="Search by product or category" name="search">
          <button class="search-btn" type="submit"><i class=" bi fs-5 bi-search"></i></button>
        </form>
      </div>
      <div class="links">
        <div class="icon"><a href="/admin">Home</a></div>
        <div class="icon"><a class="active" href="/add/category"><i class="bi bi-plus-lg"></i>Category</a></div>
        <div class="icon"><a href="/add/product"><i class="bi bi-plus-lg"></i>Product</a></div>
        <div class="icon"><a href="/logout">Logout</a></div>
      </div>
    </div>
  </nav>


  {% if alert %}
  <div class="alert alert-success alert-dismissible fade show mt-1" role="alert">
    <strong>{{alert}}</strong>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  {% endif %}


  <div class="forms">
    <form action="/add/category" method="POST">
      <div class="heading">
        <h1>Add Category</h1>
      </div>
      <div class="input-field" style="grid-column: span 2;">
        <label>Category Name</label>
        <input type="text" placeholder="Category Name" name="cate" required>
      </div>
      {% if error %}
      <div class="error"><strong>{{error}}</strong></div>
      {% endif %}
      <div class="add-btn"><button type="submit">Add</button></div>
    </form>
  </div>

  <script src="/static/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
    crossorigin="anonymous"></script>
</body>

</html>
