<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='cart.css') }}">
  <title>Search</title>
</head>

<body>
  <nav class="nav">
    <div class="container-fluid nav-items">
      <div class="logo">
        Grocery Store
      </div>
      <div class="search-box">
        <form action="/admin_search" method="POST">
          <input class="search" type="search" placeholder="Search by product or category" name="search" value="{{search}}">
          <button class="search-btn" type="submit"><i class=" bi fs-5 bi-search"></i></button>
        </form>
      </div>
      <div class="links">
        <div class="icon"><a href="/admin">Home</a></div>
        <div class="icon"><a href="/logout">Logout</a></div>
      </div>
    </div>
  </nav>

  <div class="container">
    {% if search_results != [] %}
    {% for item in search_results %}
    <div class="cart_item bg-light">
      <div class="cart_info">
        <div class="image">
          <img src="/static/images/{{item.image}}" alt="Image" >
        </div>
        <div class="prod_cate">
          <span class="prod_name">{{item.name}}</span><br />
          <span class="cate_name">{{item.category.name}}</span>
        </div>
        <div class="price">{{item.qnt}}</div>
        <div class="price">₹ {{item.price}}/-</div>
        <div class="admin_actions">
            <a title="Delete product" onclick="alert_prod()" class="prod_delete" href="/del/product/{{item.id}}"><button><i class="bi bi-trash"></i>Delete</button></a>
            <a title="Update product" href="/update/product/{{item.id}}"><button><i class="bi bi-pencil-square"></i>Edit</button></a>
        </div>
      </div>
    </div>
    {% endfor %}
    {% else %}
    <div class="massage">No search result found</div>
    {% endif %}
  </div>



  <script src="/static/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
    crossorigin="anonymous"></script>
</body>
</body>

</html>
